<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - The Blush Makeover</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="brand">💄 The Blush Makeover</div>
  <div>
    <a href="index.html">Home</a>
    <a href="packages.html">Packages</a>
    <a href="signup.html">Sign Up</a>
    <a href="login.html">Login</a>
    <a href="admin.html">Admin</a>
  </div>
</nav>

<div class="container">
  <h2>Login</h2>

  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required>

    <label for="password">Password</label>
    <div class="password-wrap">
      <input type="password" id="password" required>
      <button type="button" class="toggle-eye" id="toggleBtn1"
        onclick="togglePassword('password','toggleBtn1')">Show</button>
    </div>

    <button type="submit" class="primary">Login</button>
    <div id="loginMsg" class="msg"></div>
  </form>

  <p style="margin-top:16px; font-size:14px;">
    No account? <a href="signup.html">Sign up here</a>
  </p>
</div>

<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>

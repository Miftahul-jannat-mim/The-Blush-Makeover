<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up - The Blush Makeover</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="brand">💄 The Blush Makeover</div>
  <div>
    <a href="index.html">Home</a>
    <a href="packages.html">Packages</a>
    <a href="signup.html">Sign Up</a>
    <a href="login.html">Login</a>
    <a href="admin.html">Admin</a>
  </div>
</nav>

<div class="container">
  <h2>Create an Account</h2>

  <form id="signupForm">
    <label for="username">Full Name</label>
    <input type="text" id="username" required>

    <label for="email">Email</label>
    <input type="email" id="email" required>

    <label for="password">Password</label>
    <div class="password-wrap">
      <input type="password" id="password" required>
      <button type="button" class="toggle-eye" id="toggleBtn1"
        onclick="togglePassword('password','toggleBtn1')">Show</button>
    </div>
    <div class="hint">Password must be 8 to 16 characters long.</div>

    <label for="confirmPassword">Confirm Password</label>
    <div class="password-wrap">
      <input type="password" id="confirmPassword" required>
      <button type="button" class="toggle-eye" id="toggleBtn2"
        onclick="togglePassword('confirmPassword','toggleBtn2')">Show</button>
    </div>

    <button type="submit" class="primary">Create Account</button>
    <div id="signupMsg" class="msg"></div>
  </form>
</div>

<script src="js/api.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
